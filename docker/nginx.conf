map $http_x_forwarded_proto $upstream_forwarded_proto {
    "~*^https$" https;
    "~*^http$"  http;
    default      $scheme;
}

map $http_x_forwarded_for $rate_limit_client {
    "~^(?<forwarded_client_ip>[^, ]+)" $forwarded_client_ip;
    default                              $binary_remote_addr;
}

limit_req_zone $rate_limit_client zone=login_per_client:10m rate=5r/m;
limit_req_zone $rate_limit_client zone=analysis_per_client:10m rate=30r/m;

# Log the normalized path ($uri), never the query string or request body.
log_format path_only '[$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent ${request_time}s';

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;
    server_tokens off;
    limit_req_status 429;
    access_log /var/log/nginx/access.log path_only;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/api(?:/v1)?/auth/login/?$ {
        limit_req zone=login_per_client burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    location ~ ^/api(?:/v1)?/analyze-(?:sql|spam|file)(?:/|$) {
        limit_req zone=analysis_per_client burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
