  <text class="box-text" x="250" y="849" text-anchor="middle">Users, roles, tenants</text>
  <text class="box-text" x="250" y="867" text-anchor="middle">Alerts, cases, logs, config</text>

  <rect class="asset" x="485" y="805" width="280" height="78"/>
  <text class="box-title" x="625" y="829" text-anchor="middle">Model Artefacts</text>
  <text class="box-text" x="625" y="849" text-anchor="middle">Joblib models and scalers</text>
  <text class="box-text" x="625" y="867" text-anchor="middle">SQL, file and spam classifiers</text>

  <rect class="asset" x="865" y="805" width="280" height="78"/>
  <text class="box-title" x="1005" y="829" text-anchor="middle">Rules and Threat Data</text>
  <text class="box-text" x="1005" y="849" text-anchor="middle">YARA, blocklists, thresholds</text>
  <text class="box-text" x="1005" y="867" text-anchor="middle">Security corpora and labels</text>

  <rect class="asset" x="1245" y="805" width="250" height="78"/>
  <text class="box-title" x="1370" y="829" text-anchor="middle">Validation Evidence</text>
  <text class="box-text" x="1370" y="849" text-anchor="middle">Pytest, build checks</text>
  <text class="box-text" x="1370" y="867" text-anchor="middle">Benchmark runs and reports</text>

  <path class="line" d="M210 602 L210 795"/>
  <path class="line" d="M500 602 L500 735 L250 735 L250 795"/>
  <path class="line" d="M790 602 L790 735 L250 735 L250 795"/>
  <path class="line" d="M1080 602 L1080 735 L250 735 L250 795"/>
  <path class="line" d="M1370 602 L1370 795"/>
  <path class="line" d="M655 686 L655 795"/>
  <path class="line" d="M625 805 L625 735 L210 735 L210 612"/>
  <path class="line" d="M1005 805 L1005 735 L500 735 L500 612"/>
  <path class="line" d="M1005 805 L1005 735 L790 735 L790 612"/>

  <rect class="band" x="40" y="965" width="1520" height="110"/>
  <text class="band-title" x="70" y="995">Optional Lab and External Integration Paths</text>

  <rect class="external" x="190" y="1015" width="350" height="42"/>
  <text class="box-title" x="365" y="1041" text-anchor="middle">DVWA and MySQL General Log Forwarder</text>

  <rect class="external" x="660" y="1015" width="280" height="42"/>
