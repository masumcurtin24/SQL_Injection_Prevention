  <rect class="backend" x="130" y="325" width="270" height="70"/>
  <text class="box-title" x="265" y="349" text-anchor="middle">FastAPI Backend</text>
  <text class="box-text" x="265" y="369" text-anchor="middle">REST API and WebSocket routes</text>
  <text class="box-text" x="265" y="387" text-anchor="middle">Port 8000 in local setup</text>

