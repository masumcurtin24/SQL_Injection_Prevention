<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">System Operational Architecture Flowchart</title>
  <desc id="desc">Operational architecture showing user browser, React frontend, FastAPI backend, analysis services, persistence, evidence assets, and optional integrations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #475569; }
      .band-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 13px Arial, sans-serif; fill: #334155; }
      .note { font: 400 12px Arial, sans-serif; fill: #64748b; }
      .band { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .user { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; rx: 10; }
      .frontend { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 10; }
      .backend { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .service { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 10; }
      .asset { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 10; }
      .storage { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; rx: 10; }
      .external { fill: #fdf2f8; stroke: #db2777; stroke-width: 2; rx: 10; }
      .line { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); stroke-dasharray: 7 6; }
      .label { font: 700 12px Arial, sans-serif; fill: #1e293b; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1120"/>
  <text class="title" x="800" y="52" text-anchor="middle">System Operational Architecture Flowchart</text>
  <text class="subtitle" x="800" y="82" text-anchor="middle">COMP6016 security analysis platform runtime view</text>

  <rect class="band" x="40" y="118" width="1520" height="120"/>
  <text class="band-title" x="70" y="148">User and Frontend Access</text>

  <rect class="user" x="80" y="168" width="230" height="48"/>
  <text class="box-title" x="195" y="188" text-anchor="middle">User / Supervisor</text>
  <text class="box-text" x="195" y="207" text-anchor="middle">Browser-based interaction</text>

  <rect class="frontend" x="415" y="158" width="310" height="68"/>
  <text class="box-title" x="570" y="181" text-anchor="middle">React Frontend</text>
  <text class="box-text" x="570" y="201" text-anchor="middle">Dashboard, SQL, File, Email</text>
  <text class="box-text" x="570" y="219" text-anchor="middle">Alerts, Cases, Policies</text>

  <rect class="frontend" x="835" y="158" width="290" height="68"/>
  <text class="box-title" x="980" y="181" text-anchor="middle">API Client</text>
  <text class="box-text" x="980" y="201" text-anchor="middle">REST requests</text>
  <text class="box-text" x="980" y="219" text-anchor="middle">WebSocket listener</text>

  <rect class="backend" x="1230" y="158" width="250" height="68"/>
  <text class="box-title" x="1355" y="181" text-anchor="middle">Live Updates</text>
  <text class="box-text" x="1355" y="201" text-anchor="middle">Security events</text>
  <text class="box-text" x="1355" y="219" text-anchor="middle">Alert notifications</text>

