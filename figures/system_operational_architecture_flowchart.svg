  <text class="box-title" x="647" y="349" text-anchor="middle">Middleware Layer</text>
  <text class="box-text" x="647" y="369" text-anchor="middle">Auth, role, tenant flow</text>
  <text class="box-text" x="647" y="387" text-anchor="middle">CORS and request handling</text>

  <rect class="backend" x="895" y="325" width="300" height="70"/>
  <text class="box-title" x="1045" y="349" text-anchor="middle">API Routers</text>
  <text class="box-text" x="1045" y="369" text-anchor="middle">SQL, File, Spam, Dashboard</text>
  <text class="box-text" x="1045" y="387" text-anchor="middle">Alerts, Cases, Audit, Policy</text>

  <rect class="backend" x="1300" y="325" width="180" height="70"/>
  <text class="box-title" x="1390" y="349" text-anchor="middle">WebSocket</text>
  <text class="box-text" x="1390" y="369" text-anchor="middle">/api/v1/ws/updates</text>
  <text class="box-text" x="1390" y="387" text-anchor="middle">Live event stream</text>

  <path class="line" d="M980 226 L980 270 L265 270 L265 315"/>
  <path class="line" d="M400 360 L495 360"/>
  <path class="line" d="M790 360 L885 360"/>
  <path class="line" d="M1195 360 L1290 360"/>
  <path class="line-soft" d="M1390 325 L1390 236"/>

