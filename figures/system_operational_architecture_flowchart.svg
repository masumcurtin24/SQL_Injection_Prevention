  <text class="band-title" x="70" y="485">Security Analysis and Operational Services</text>

  <rect class="service" x="95" y="520" width="230" height="82"/>
  <text class="box-title" x="210" y="544" text-anchor="middle">SQL Security</text>
  <text class="box-text" x="210" y="564" text-anchor="middle">Analysis and enforcement</text>
  <text class="box-text" x="210" y="582" text-anchor="middle">Risk, severity, reasons</text>

