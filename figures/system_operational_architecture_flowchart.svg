  <text class="box-text" x="790" y="582" text-anchor="middle">Score and explanation</text>

  <rect class="service" x="965" y="520" width="230" height="82"/>
  <text class="box-title" x="1080" y="544" text-anchor="middle">Dashboard Reporting</text>
  <text class="box-text" x="1080" y="564" text-anchor="middle">Summary, trends, metrics</text>
  <text class="box-text" x="1080" y="582" text-anchor="middle">Operational visibility</text>

  <rect class="service" x="1255" y="520" width="230" height="82"/>
  <text class="box-title" x="1370" y="544" text-anchor="middle">Alerts and Cases</text>
  <text class="box-text" x="1370" y="564" text-anchor="middle">Triage and investigation</text>
  <text class="box-text" x="1370" y="582" text-anchor="middle">Acknowledgement workflow</text>

  <rect class="service" x="530" y="630" width="250" height="56"/>
  <text class="box-title" x="655" y="653" text-anchor="middle">Policy and Configuration</text>
  <text class="box-text" x="655" y="673" text-anchor="middle">Rules, thresholds and settings</text>

  <rect class="service" x="830" y="630" width="250" height="56"/>
  <text class="box-title" x="955" y="653" text-anchor="middle">Reliability and Explanation</text>
  <text class="box-text" x="955" y="673" text-anchor="middle">Evidence payloads and limitations</text>

