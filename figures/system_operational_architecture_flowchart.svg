  <path class="line-soft" d="M800 1015 L800 944 L500 944 L500 612"/>
  <path class="line-soft" d="M1230 1015 L1230 944 L1370 944 L1370 893"/>

  <text class="note" x="800" y="1098" text-anchor="middle">Flowchart reflects the implemented prototype architecture evidenced by frontend src, FastAPI routers, backend services, data/model folders, benchmark outputs, and integration helpers.</text>
</svg>
